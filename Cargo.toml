[package]
name = "nabla-game"
description = "Online version of Nabla Operator Game (https://nablagame.com/) - made with Rust/WASM"
version = "1.0.0"
authors = ["inferrinizzard"]
repository = "https://github.com/inferrinizzard/nabla-game"
license = "MIT"
categories = ["wasm"]
readme = "README.md"
edition = "2018"

[lib]
name = "nabla_game"
crate-type = ["cdylib", "rlib"]

[profile.release]
# This makes the compiled code faster and smaller, but it makes compiling slower,
# so it's only enabled in release mode.
lto = true

[features]
# If you uncomment this line, it will enable `wee_alloc`:
#default = ["wee_alloc"]

[dependencies]
# The `wasm-bindgen` crate provides the bare minimum functionality needed
# to interact with JavaScript.
wasm-bindgen = "0.2.45"

getrandom = { version = "0.2.3", features = ["js"] }
rand = "0.8.4"

gloo = "0.6.0"

js-sys = "0.3.22"

# turns an otherwise-opaque WASM trap into the actual Rust panic message +
# location in the browser console -- enabled unconditionally (not just debug
# builds) so a panic that reaches production is still diagnosable; see lib.rs
console_error_panic_hook = "0.1.5"

# `wee_alloc` is a tiny allocator for wasm that is only ~1K in code size
# compared to the default allocator's ~10K. However, it is slower than the default
# allocator, so it's not enabled by default.
wee_alloc = { version = "0.4.2", optional = true }

# The `web-sys` crate allows you to interact with the various browser APIs,
# like the DOM.
[dependencies.web-sys]
version = "0.3.22"
features = [
	"console",
	# "AudioContext",
  # "AudioBuffer",
  # "AudioNode",
  # "AudioBufferSourceNode",
  # "AudioDestinationNode",
  "Document",
  "Element",
  "HtmlElement",
  "CssStyleDeclaration",
  "HtmlCanvasElement",
  "HtmlImageElement",
  "HtmlCollection",
  "HtmlInputElement",
  "HtmlSelectElement",
	"CanvasRenderingContext2d",
  "TextMetrics",
  "MouseEvent",
  "ImageData",
  "EventListener",
  "Node",
  # "WebGlBuffer",
  # "WebGlRenderingContext",
  # "WebGlProgram",
  # "WebGlShader",
  # "WebGlUniformLocation",
  # "WebGlTexture",
  "Window",
]


# These crates are used for running unit tests.
[dev-dependencies]
wasm-bindgen-test = "0.2.45"
futures = "0.1.27"
# js-sys = "0.3.22"
wasm-bindgen-futures = "0.3.22"
